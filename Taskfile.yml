# Taskfile.yml
version: '3'

dotenv: ['.env']

vars:
  # version info
  FF_OS_RAW:
    sh: go env GOOS
  FF_ARCH:
    sh: go env GOARCH

  FF_OS: '{{if eq .FF_OS_RAW "darwin"}}MacOS{{else if eq .FF_OS_RAW "linux"}}Linux{{else if eq .FF_OS_RAW "windows"}}Windows{{else}}{{.FF_OS_RAW}}{{end}}'
  FF_NAME: "FlexFlow"
  FF_VERSION: "2.1-release"
  FF_COMMIT:
    sh: git rev-parse --short HEAD
  FF_BRANCH:
    sh: git rev-parse --abbrev-ref HEAD
  
  TAR_EXE: '{{if eq .FF_OS_RAW "windows"}}tar.exe{{else}}tar{{end}}'

  # global settings
  TMP_DIR: '{{.TEMP | default .TMPDIR | default "/tmp" }}'
  BUILD_TYPE: '{{ .BUILD_TYPE | default "Release" }}'
  BUILD_LOCK_PORT: '{{.BUILD_LOCK_PORT | default 54321 }}'

  # for cpp
  CPP_BUILD_DIR: '{{ .CPP_BUILD_DIR | default (printf "%s/build-cpp" .TMP_DIR) }}'
  CMAKE_GENERATOR: '{{ .CMAKE_GENERATOR | default "Ninja" }}'
  ENABLE_SERVER: '{{ .ENABLE_SERVER | default 1 }}'
  ENABLE_CLI: '{{ .ENABLE_CLI | default 1 }}'
  CMAKE_EXTRA_ARGS: '{{ .CMAKE_EXTRA_ARGS | default "" }}'
  JOBS: '{{ .JOBS | default 1 }}'
  MODEL_CLIENT_TIMEOUT: '{{ .MODEL_CLIENT_TIMEOUT | default 31 }}'
  MODEL_READ_BUFFER_SIZE: '{{ .MODEL_READ_BUFFER_SIZE | default 4096 }}'
  MODEL_MAX_READ_QUEUE_SIZE: '{{ .MODEL_MAX_READ_QUEUE_SIZE | default 1024 }}'

  # for webui
  WEBUI_BUILD_DIR: '{{ .WEBUI_BUILD_DIR | default (printf "%s/build-webui" .TMP_DIR) }}'

  # for package
  BUNDLE_LIB_SEARCH_DIR: '{{ .BUNDLE_LIB_SEARCH_DIR | default "" }}'
  INSTALL_PREFIX: '{{ .INSTALL_PREFIX | default (printf "%s/install" .TMP_DIR) }}'
  RELEASE_OUTPUT_DIR: '{{ .RELEASE_OUTPUT_DIR | default (printf "%s/release" .TMP_DIR) }}'
  RELEASE_GPG_ID: '{{ .RELEASE_GPG_ID | default "" }}'
  RELEASE_GPG_PUBLIC_KEY_FILE: '{{ .RELEASE_GPG_PUBLIC_KEY_FILE | default "" }}'

tasks:
  install:
    deps: [build:cpp, build:gateway]
    cmds:
      - task: 'install:{{OS}}'
  
  install:windows:
    internal: true
    cmds:
      - cmake --install {{.CPP_BUILD_DIR}}
      - cmake -E copy src-go/FlexFlowGateway.exe {{.INSTALL_PREFIX}}/FlexFlowGateway.exe
  
  install:linux:
    internal: true
    cmds:
      - cmake --install {{.CPP_BUILD_DIR}}
      - cmake -E copy src-go/FlexFlowGateway {{.INSTALL_PREFIX}}/FlexFlowGateway

  install:darwin:
    internal: true
    cmds:
      - task: 'install:linux'
  
includes:
  prepare: ./tasks/prepare.yml
  build: ./tasks/build.yml
  clean: ./tasks/clean.yml
  release: ./tasks/release.yml
