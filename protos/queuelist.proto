// Defines the QueueList service for managing queues.

syntax = "proto3";

option go_package = "FF/protos";

package ff;

import "types.proto";
import "google/api/annotations.proto";

/**
 * Provides operations for managing queues
 */
service QueueList {
  /**
   * Creates a queue with the specified name
   */
  rpc Create(QueueReq) returns (Empty) {
    option (google.api.http) = {
      post: "/api/v1/queuelist/create"
      body: "*"
    };
  }

  /**
   * Renames an existing queue
   */
  rpc Rename(RenameQueueReq) returns (Empty) {
    option (google.api.http) = {
      post: "/api/v1/queuelist/rename"
      body: "*"
    };
  }

  /**
   * Deletes the specified queue
   */
  rpc Delete(QueueReq) returns (Empty) {
    option (google.api.http) = {
      delete: "/api/v1/queuelist/delete"
    };
  }

  /**
   * Streams all queues, returning one response for each queue
   */
  rpc List(Empty) returns (stream ListQueueRes) {
    option (google.api.http) = {
      get: "/api/v1/queuelist/list"
    };
  }

  /**
   * Checks whether the specified queue exists
   * Returns an error if the queue does not exist
   */
  rpc Get(QueueReq) returns (Empty) {
    option (google.api.http) = {
      get: "/api/v1/queuelist/get"
    };
  }
}

/**
 * Parameters for renaming a queue
 */
message RenameQueueReq {
  string oldName = 1; // Current queue name
  string newName = 2; // New queue name
}

/**
 * Represents a queue returned by the list operation
 */
message ListQueueRes {
  string name = 1; // Queue name
}
