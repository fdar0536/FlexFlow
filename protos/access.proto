syntax = "proto3";

option go_package = "FF/protos";

package ff;

import "types.proto";
import "google/api/annotations.proto";

service Access {
  rpc Info(Empty) returns (InfoRes) {
    option (google.api.http) = {
      get: "/api/v1/info"
    };
  }

  rpc Login(LoginReq) returns (Empty) {
    option (google.api.http) = {
      post: "/api/v1/login"
      body: "*"
    };
  }

  rpc Logout(Empty) returns (Empty) {
    option (google.api.http) = {
      post: "/api/v1/logout"
    };
  }

  rpc Echo(Empty) returns (Empty) {
    option (google.api.http) = {
      get: "/api/v1/echo"
    };
  }
}

message InfoRes {
  string branch = 1;
  string commit = 2;
  string version = 3;
}

message LoginReq {
  string username = 1;
  string password = 2;
  string otp = 3;
  int32 tokentimeout = 4;
}
