// Defines common message types shared by FlexFlow gRPC services.

syntax = "proto3";

option go_package = "FF/protos";

package ff;

/**
 * An empty message.
 */
message Empty {
}

/**
 * Specifies a queue.
 */
message QueueReq {
  string name = 1; // Queue name
}

/**
 * Task identifier.
 */
message ListTaskRes {
  int32 ID = 1; // Task ID
}

/**
 * Request parameters for retrieving task details
 */
message TaskDetailsReq {
  string name = 1; // Queue name
  int32 ID = 2; // Task ID
}

/**
 * Detailed information about a task.
 */
message TaskDetailsRes {
  string workDir = 1; // Working directory associated with the task.
  string execName = 2; // Execution target of the task.
  repeated string args = 3; // Arguments passed to the execution target.
  int32 exitCode = 4; // Completion status reported after the task enters the finished list. Its exact meaning is implementation-defined.
  int32 ID = 5; // Task ID.
}
