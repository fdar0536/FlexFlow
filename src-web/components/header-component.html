<mat-tab-group>
  <mat-tab>
    <ng-template mat-tab-label>
      <div class="HeaderTab" routerLink="/">
        <mat-icon>playlist_add</mat-icon>
        <p class="CommonText">Main</p>
      </div>
    </ng-template>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <mat-icon>terminal</mat-icon>
      <p class="CommonText">Output</p>
    </ng-template>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <div class="HeaderTab" routerLink="/about">
        <mat-icon>info</mat-icon>
        <p class="BaseText">About</p>
      </div>
    </ng-template>
  </mat-tab>
  <mat-tab>
    <ng-template mat-tab-label>
      <div class="HeaderTab" (click)="onLogoutClicked($event)">
        <mat-icon>close</mat-icon>
        <p class="BaseText">Logout</p>
      </div>
    </ng-template>
  </mat-tab>
</mat-tab-group>
