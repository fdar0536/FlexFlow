<h2 mat-dialog-title>
    {{ data.title }}
</h2>
<mat-dialog-content>
    <p class="CommonText">{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>
    @if (data.isInfo)
    {
        <button matButton mat-dialog-close class="CommonText">OK</button>
    }
    @else
    {
        <button matButton [mat-dialog-close]="true" class="CommonText">Yes</button>
        <button matButton mat-dialog-close class="CommonText">No</button>
        <button matButton mat-dialog-close class="CommonText">Cancel</button>
    }
</mat-dialog-actions>
