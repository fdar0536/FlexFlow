<!-- Connect info -->
<form [formGroup]="profileForm">
    <common-layout
        align_items="center"
        justify_content="center"
        gap="10"
    >
        <mat-form-field appearance="outline">
            <mat-label>Host</mat-label>
            <input
                matInput
                placeholder="Your host"
                formControlName="host"
            >
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input
                matInput
                placeholder="Your username"
                formControlName="username"
            >
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input
                matInput
                placeholder="Your password"
                formControlName="password"
                type="password"
            >
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>TOTP</mat-label>
            <input
                matInput
                placeholder="Your TOTP"
                formControlName="totp"
                type="password"
            >
        </mat-form-field>
    </common-layout>
</form>

<!-- Connect button -->
<common-layout
    align_items="center"
    justify_content="center"
    gap="10"
>
    <button matFab extended (click)="onLoadClicked()">
        <mat-icon>file_open</mat-icon>
        <p class="CommonText">Load profile</p>
    </button>
    <button matFab extended (click)="onSaveClicked()">
        <mat-icon>save</mat-icon>
        <p class="CommonText">Save profile</p>
    </button>
    <button matFab extended (click)="onClearClicked()">
        <mat-icon>delete</mat-icon>
        <p class="CommonText">Clear</p>
    </button>
    <button matFab extended (click)="onDisconnectClicked()">
        <mat-icon>link_off</mat-icon>
        <p class="CommonText">Disconnect/Reset</p>
    </button>
    <button matFab extended (click)="onConnectClicked()">
        <mat-icon>link</mat-icon>
        <p class="CommonText">Connect</p>
    </button>
    <button matFab extended (click)="onConnectClicked()">
        <mat-icon>rss_feed</mat-icon>
        <p class="CommonText">Echo Test</p>
    </button>
</common-layout>
