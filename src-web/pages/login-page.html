<!-- Connect info -->
<h1>Flex Flow Web UI Login</h1>
<form [formGroup]="profileForm">
    <common-layout
        align_items="center"
        justify_content="center"
        gap="10"
        direction="column"
    >
        <mat-form-field appearance="outline">
            <mat-label>Username</mat-label>
            <input
                matInput
                placeholder="Your username"
                formControlName="username"
            >
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Password</mat-label>
            <input
                matInput
                placeholder="Your password"
                formControlName="password"
                type="password"
            >
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>TOTP</mat-label>
            <input
                matInput
                placeholder="Your TOTP"
                formControlName="totp"
            >
        </mat-form-field>
        <mat-form-field appearance="outline">
            <mat-label>Session length</mat-label>
            <input
                matInput
                placeholder="Session length in seconds"
                formControlName="tokenTimeOut"
            >
        </mat-form-field>
    </common-layout>
</form>

<!-- Connect button -->
<common-layout
    align_items="center"
    justify_content="center"
    gap="20"
>
    <button matFab extended (click)="onClearClicked()">
        <mat-icon>delete</mat-icon>
        <p class="CommonText">Clear</p>
    </button>
    <button matFab extended (click)="onLoginClicked()">
        <mat-icon>exit_to_app</mat-icon>
        <p class="CommonText">Login</p>
    </button>
</common-layout>
<h2> </h2>
<common-layout
    direction="row"
    align_items="center"
    justify_content="center"
    gap="10"
>
    <p class="CommonText">Flex Flow {{ version }}</p>
    <p class="CommonText">Branch: {{ branch }}</p>
    <p class="CommonText">Commit: {{ commit }}</p>
</common-layout>
