version: '3'

tasks:
  package:
    deps: [":install", ":build:webui"]
    cmds:
      - cmake -E make_directory {{.RELEASE_OUTPUT_DIR}}
      - { cmd: 'find {{.INSTALL_PREFIX}} -type f -name "*.dylib" -exec codesign -f -s - {} \;', platforms: [darwin] }
      - { cmd: 'find {{.INSTALL_PREFIX}} -type f -exec sh -c ''file "$1" | grep -q "Mach-O" && codesign -f -s - "$1"'' _ {} \;', platforms: [darwin] }
      - '{{.TAR_EXE}} -cvp --zstd --exclude-from=tar.exclude -C {{.INSTALL_PREFIX}} -f {{.RELEASE_OUTPUT_DIR}}/{{.FF_NAME}}-{{.FF_VERSION}}-{{.FF_OS}}-{{.FF_ARCH}}.tar.zst .'
      - '{{.TAR_EXE}} -cvp --zstd --exclude-from=tar.exclude -C {{.WEBUI_BUILD_DIR}} -f {{.RELEASE_OUTPUT_DIR}}/{{.FF_NAME}}-{{.FF_VERSION}}-webui-noarch.tar.zst .'

  checksums:
    dir: '{{.RELEASE_OUTPUT_DIR}}'
    preconditions:
      - sh: command -v sha256sum >/dev/null 2>&1
        msg: sha256sum is required
    cmds:
      - |
        find . -maxdepth 1 -type f \
          ! -name 'SHA256SUMS*' \
          -print0 |
        sort -z |
        xargs -0 sha256sum > SHA256SUMS

  sign:
    deps:
      - checksums
    preconditions:
      - sh: command -v gpg >/dev/null 2>&1
        msg: GnuPG is required
      - sh: test -n "{{.RELEASE_GPG_ID}}"
        msg: Set GPG_KEY_ID to the signing key fingerprint
    cmds:
      - |
        gpg \
          --batch \
          --yes \
          --local-user "{{.RELEASE_GPG_ID}}" \
          --armor \
          --detach-sign \
          --output "{{.RELEASE_OUTPUT_DIR}}/SHA256SUMS.asc" \
          "{{.RELEASE_OUTPUT_DIR}}/SHA256SUMS"

  verify:
    preconditions:
      - sh: command -v gpg >/dev/null 2>&1
        msg: GnuPG is required
      - sh: command -v sha256sum >/dev/null 2>&1
        msg: sha256sum is required
      - sh: test -f "{{.RELEASE_GPG_PUBLIC_KEY_FILE}}"
        msg: Release public key was not found
    cmds:
      - |
        GNUPGHOME="$(mktemp -d)"
        trap 'rm -rf "$GNUPGHOME"' EXIT

        chmod 700 "$GNUPGHOME"

        gpg --homedir "$GNUPGHOME" \
          --batch \
          --import "{{.RELEASE_GPG_PUBLIC_KEY_FILE}}"

        gpg --homedir "$GNUPGHOME" \
          --batch \
          --verify \
          "{{.RELEASE_OUTPUT_DIR}}/SHA256SUMS.asc" \
          "{{.RELEASE_OUTPUT_DIR}}/SHA256SUMS"

        cd "{{.RELEASE_OUTPUT_DIR}}"
        sha256sum --check SHA256SUMS
